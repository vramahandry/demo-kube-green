apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-app-sts-a
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
    {{- with .Values.statefulset.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceName: demo-app-sts-a
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo-app.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-app.labels" . | nindent 8 }}
        {{- with .Values.statefulset.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: {{ include "demo-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sleep", "infinity"]
